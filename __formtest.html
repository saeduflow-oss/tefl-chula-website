<!doctype html><meta charset="utf-8">
<style>body{margin:0}iframe{width:1000px;height:1000px;border:0}</style>
<iframe id="f" src="contact.html"></iframe>
<script>
const MODE = new URLSearchParams(location.search).get('m') || 'ok';
const f=document.getElementById('f');
f.addEventListener('load',()=>{
  const d=f.contentDocument;
  const form=d.getElementById('contactForm');
  if(MODE==='err'){
    form.elements.name.value='Somchai Jaidee';
    form.elements.email.value='not-an-email';
    form.requestSubmit();
  }else{
    form.elements.name.value='Somchai Jaidee';
    form.elements.email.value='somchai@example.com';
    form.elements.phone.value='081-234-5678';
    form.elements.topic.value='Admissions';
    form.elements.message.value='I would like to ask about the admission timeline and required documents for the next intake.';
    form.requestSubmit();
  }
  setTimeout(()=>{ d.getElementById('send-a-message').scrollIntoView({block:'start'}); },150);
});
</script>
