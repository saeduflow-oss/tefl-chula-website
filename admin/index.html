<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<!-- ไฟล์นี้อยู่ในโฟลเดอร์ admin/ แต่รูป ฟอนต์ และรูปในเนื้อหาทั้งหมดอ้างพาธจากรากเว็บ
     base href ตัวนี้ทำให้พาธสัมพัทธ์ทุกอันย้อนขึ้นไปหนึ่งชั้นให้เอง
     ถ้าลบออก โลโก้ ฟอนต์ และรูปย่อในหน้ารายการจะเสียหมด -->
<base href="../">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>TEFL Chula — ระบบจัดการเนื้อหา</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<!-- ฟอนต์ของหน้า admin แยกจากเว็บหลักโดยตั้งใจ: เนื้อความ/ตารางใช้ IBM Plex Sans Thai ให้อ่านตัวเลขสบายตา
     ส่วนชื่อแบรนด์และหัวต้อนรับใช้ฟอนต์ Chulalongkorn ของเว็บหลัก ให้รู้ว่าเป็นระบบของ TEFL Chula
     Google Fonts เป็นข้อยกเว้นของกฎ "ไม่พึ่ง CDN" เพราะถ้าโหลดไม่ได้ก็แค่ตกไปฟอนต์ระบบ ไม่มีอะไรพัง -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="fonts/chula.css">
<link rel="stylesheet" href="admin/admin.css">
</head>
<body>

<!-- ============ ล็อกอิน (แบบหน้า wp-login: โลโก้เหนือกล่อง) ============ -->
<div id="login">
  <div class="login-wrap">
    <img class="login-logo" src="img/logo.png" alt="TEFL Chula — Faculty of Education, Chulalongkorn University">
    <form id="loginForm">
      <p class="login-title">ระบบจัดการเนื้อหาเว็บไซต์หลักสูตร TEFL</p>
      <div class="msg err" id="loginMsg"></div>
      <div class="field">
        <label for="email">อีเมล</label>
        <input type="email" id="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">รหัสผ่าน</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <div class="login-foot">
        <span class="hint">สำหรับผู้ดูแลระบบเท่านั้น</span>
        <button class="btn primary" id="loginBtn">เข้าสู่ระบบ</button>
      </div>
    </form>
    <p class="login-back"><a href="index.html">← กลับไปที่เว็บไซต์ TEFL Chula</a></p>
  </div>
</div>

<!-- ============ หน้าจัดการ ============
     โครงแบบ WordPress: แถบดำด้านบน (admin bar) + เมนูดำด้านซ้าย + พื้นที่ทำงานพื้นเทาอ่อน
     หน้าแก้ไขเป็นหน้าเต็ม (ไม่ใช่แผงเลื่อน) และมี URL ของตัวเอง (#ชุดข้อมูล/รหัส) ปุ่ม Back ของเบราว์เซอร์จึงใช้ได้ -->
<div id="app">
  <header id="adminbar">
    <button class="ab-item" id="sideToggle" aria-label="เมนู">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="ab-item ab-site" href="index.html" target="_blank" rel="noopener" title="ดูเว็บไซต์">
      <img src="img/favicon.png" alt=""><span class="ab-name">TEFL Chula</span>
    </a>
    <div class="ab-new">
      <button class="ab-item" id="newAny" aria-haspopup="menu">
        <svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="ab-label">เพิ่มใหม่</span>
      </button>
      <div class="ab-drop" id="newMenu"></div>
    </div>
    <span class="ab-sp"></span>
    <button class="ab-item" id="theme" title="สลับโหมดสว่าง/มืด">
      <svg class="i" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <div class="ab-me">
      <button class="ab-item" id="ustrip" aria-haspopup="menu" aria-expanded="false">
        <span class="ab-label">สวัสดี, <b id="who"></b></span><span class="av" id="avatar">A</span>
      </button>
      <div class="umenu" id="umenu">
        <div class="umenu-head"><span class="av big" id="avatarBig">A</span><div><b id="whoName"></b><small id="whoSub"></small></div></div>
        <a data-v="profile">แก้ไขโปรไฟล์</a>
        <a data-v="prefs">ตั้งค่าและผู้ดูแล</a>
        <a id="logout" class="out">ออกจากระบบ</a>
      </div>
    </div>
  </header>

  <div class="shell" id="shell">
    <aside class="side" id="side">
      <nav class="menu" id="menu"></nav>
      <button class="collapse" id="collapse">
        <svg class="i" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg><span>ย่อเมนู</span>
      </button>
    </aside>
    <div class="side-scrim" id="scrim"></div>
    <main id="view"></main>
  </div>
</div>

<div class="msg ok toast" id="toast"></div>


<!-- =========================================================
     สคริปต์ของหน้า admin แยกเป็นไฟล์ตามหน้าที่ใน admin/js/ (ไม่มี build step)
     เป็น classic script ทั้งหมด: ตัวแปร/ฟังก์ชันระดับบนสุดมองเห็นกันข้ามไฟล์
     จึงต้องโหลดตามลำดับนี้ — config → icons → schema → core → หน้าต่าง ๆ → editor → app
     (ไม่ใช้ ES module เพราะเปิดจาก file:// แล้ว import จะโดน CORS ปิด)

     ไม่ใช้ supabase-js จาก CDN โดยตั้งใจ: คุยกับ REST API ตรง ๆ ด้วย fetch
     เว็บนี้ไม่มี build step และไม่มี package manager (ดู CLAUDE.md) การไม่พึ่ง CDN
     ทำให้หน้านี้ไม่พังเวลา CDN ล่มหรือเปลี่ยนเวอร์ชัน

     สิทธิ์ทั้งหมดคุมที่ฐานข้อมูลด้วย RLS ไม่ได้คุมที่หน้าจอนี้
     ต่อให้แก้ JavaScript ในเบราว์เซอร์ก็เขียนข้อมูลไม่ได้ถ้าไม่มี token ที่ล็อกอินแล้ว
     ========================================================= -->
<script src="admin/js/config.js"></script>
<script src="admin/js/icons.js"></script>
<script src="admin/js/schema.js"></script>
<script src="admin/js/core.js"></script>
<script src="admin/js/views/shell.js"></script>
<script src="admin/js/views/dashboard.js"></script>
<script src="admin/js/views/list.js"></script>
<script src="admin/js/views/facebook.js"></script>
<script src="admin/js/views/account.js"></script>
<script src="admin/js/editor.js"></script>
<script src="admin/js/app.js"></script>
</body>
</html>
