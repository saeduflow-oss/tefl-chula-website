<!doctype html><meta charset="utf-8">
<style>html,body{margin:0}iframe{width:390px;height:800px;border:0}</style>
<iframe id="f" src="contact.html"></iframe>
<script>
document.getElementById('f').addEventListener('load',()=>{
  const d=document.getElementById('f').contentDocument, w=390;
  console.log('scrollWidth', d.documentElement.scrollWidth, d.body.scrollWidth);
  const bad=[];
  d.querySelectorAll('*').forEach(el=>{
    const r=el.getBoundingClientRect();
    if(r.right > w+1 && r.width>0) bad.push(el.tagName+'.'+(el.className&&el.className.baseVal===undefined?el.className:'')+' right='+Math.round(r.right)+' w='+Math.round(r.width));
  });
  console.log('OVERFLOW_COUNT', bad.length);
  console.log(bad.slice(0,25).join(' || '));
});
</script>
